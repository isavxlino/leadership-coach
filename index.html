<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="Leadership Coach: simulador de conversas de liderança. Conversas que desenvolvem líderes.">
<title>Leadership Coach | Conversas que desenvolvem líderes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2317273B'/%3E%3Cpath d='M8 21v-9a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-6l-4 3z' fill='%236FA99B'/%3E%3C/svg%3E">
<style>
/* ===== 1. TOKENS ===== */
:root{
  --navy:#17273B; --petrol:#236B83; --sage:#6FA99B; --bg:#F6F8FA; --card:#fff;
  --muted:#64748B; --amber:#D9A441; --red:#D86B6B;
  --sage-d:#2E6E60; --amber-d:#7A5410; --red-d:#9A3A3A;
  --sage-t:#E7F2EF; --amber-t:#FBF2DF; --red-t:#FBEAEA; --petrol-t:#E4F0F4;
  --line:#DCE3EB; --line-2:#C3CDD9; --text:#17273B;
  --r:14px; --r-s:10px; --shadow:0 1px 2px rgba(23,39,59,.05),0 6px 18px rgba(23,39,59,.05);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans)}
h1,h2,h3,h4{margin:0;line-height:1.2;font-family:var(--serif);font-weight:700;letter-spacing:-.005em}
h1{font-size:clamp(1.8rem,1.3rem + 2vw,2.5rem)} h2{font-size:1.35rem} h3{font-size:1.08rem} h4{font-size:.95rem;font-family:var(--sans)}
p{margin:0} button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--petrol);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:100}
.skip:focus{top:12px}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
/* ===== 2. LAYOUT ===== */
.topbar{background:var(--navy);color:#fff}
.topbar-in{max-width:1180px;margin:0 auto;padding:14px clamp(16px,3vw,32px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;color:#fff;cursor:pointer;padding:0;text-align:left}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--sage);color:var(--navy);display:grid;place-items:center}
.brand b{display:block;font-family:var(--serif);font-size:1.18rem;line-height:1.1}
.brand small{display:block;color:#B7C4D4;font-size:.78rem}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{display:flex;align-items:center;gap:8px;background:none;border:0;color:#D5DEE9;padding:9px 14px;border-radius:10px;cursor:pointer;transition:background .15s}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.nav button[aria-current="page"]{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:32px clamp(16px,3vw,32px) 64px}
.screen{animation:enter .28s ease both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:grid;gap:8px;max-width:72ch;margin-bottom:26px}
.page-head p{color:var(--muted);font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px}
.stack{display:grid;gap:22px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.cols-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.section-title{margin:34px 0 14px}
/* ===== 3. COMPONENTES ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:10px 20px;border-radius:var(--r-s);border:1px solid var(--line-2);background:#fff;color:var(--navy);font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){background:#EEF3F7;border-color:#9FB0C2}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--navy);border-color:var(--navy)}
.btn.danger{color:var(--red-d);border-color:#E3B2B2}
.btn.danger:hover:not(:disabled){background:var(--red-t)}
.btn.danger.solid{background:#A93F3F;border-color:#A93F3F;color:#fff}
.btn.small{min-height:38px;padding:6px 14px;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:.85rem;font-weight:600;background:var(--petrol-t);color:var(--petrol);border:1px solid #BCD9E2}
.chip.ok{background:var(--sage-t);color:var(--sage-d);border-color:#BBD9D1}
.chip.warn{background:var(--amber-t);color:var(--amber-d);border-color:#EBD3A0}
.chip.risk{background:var(--red-t);color:var(--red-d);border-color:#E8BDBD}
.chip.plain{background:#EEF2F6;color:var(--muted);border-color:var(--line)}
.chip .icon{width:15px;height:15px}
.diff{display:inline-flex;gap:3px;align-items:center}
.diff i{width:14px;height:6px;border-radius:3px;background:#D5DDE6}.diff i.on{background:var(--petrol)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;flex:none;color:var(--navy);background:#DCE7EF}
.avatar.a1{background:#D6E9E4}.avatar.a2{background:#E3E1F0}.avatar.me{background:var(--navy);color:#fff}
.avatar.sm{width:34px;height:34px;font-size:.78rem}.avatar.lg{width:60px;height:60px;font-size:1.15rem}
.meter{display:flex;gap:4px}.meter i{display:block;width:20px;height:7px;border-radius:4px;background:#E0E6ED}.meter i.on{background:var(--petrol)}
.progress{height:8px;border-radius:99px;background:#E3E9F0;overflow:hidden}.progress>span{display:block;height:100%;background:var(--petrol);transition:width .4s}
.bar{height:12px;border-radius:99px;background:#E3E9F0;overflow:hidden}.bar>span{display:block;height:100%;border-radius:99px;background:var(--petrol)}
.bar.ok>span{background:var(--sage)}.bar.warn>span{background:var(--amber)}.bar.risk>span{background:var(--red)}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;margin:12px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.93rem}
.facts li{display:flex;gap:7px;align-items:center}
.list{margin:10px 0 0;padding-left:1.15em;display:grid;gap:8px}
.notice{border-radius:var(--r-s);padding:13px 16px;background:var(--amber-t);border:1px solid #EBD3A0;color:#5A3D07;display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.notice.info{background:var(--petrol-t);border-color:#BCD9E2;color:#17475A}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
details.acc{border:1px solid var(--line);border-radius:var(--r-s);padding:0 16px;background:#FBFCFD}
details.acc summary{cursor:pointer;padding:13px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-size:1.3rem;color:var(--petrol)}
details.acc[open] summary::after{content:"−"}
.acc-body{padding:0 0 16px;display:grid;gap:10px;color:var(--muted);font-size:.95rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(23,39,59,.3);z-index:60;max-width:min(92vw,520px)}
dialog{border:0;border-radius:var(--r);padding:26px;max-width:min(92vw,440px);box-shadow:0 20px 60px rgba(23,39,59,.35);color:var(--text)}
dialog::backdrop{background:rgba(23,39,59,.5)} dialog h2{margin-bottom:8px} dialog p{color:var(--muted);margin-bottom:22px} dialog .row{justify-content:flex-end}
.field{display:grid;gap:6px;margin-bottom:16px}.field label{font-weight:600}
.field textarea,.field input,.field select{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:var(--r-s);background:#fff;min-height:46px}
.field textarea{min-height:96px;resize:vertical}
.hero{background:linear-gradient(0deg,var(--sage-t),var(--sage-t));border:1px solid #CFE3DD;border-radius:var(--r);padding:26px clamp(18px,3vw,32px);display:grid;gap:8px}
.hero h2{font-size:1.5rem}.hero p{max-width:62ch;color:#2F4A57;font-size:1.05rem}
.sc-card{display:grid;gap:12px;align-content:start}
.sc-card h3{font-size:1.25rem}
.stat{display:grid;gap:2px}.stat b{font-family:var(--serif);font-size:1.9rem;line-height:1}.stat span{color:var(--muted);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:18px}
.attempt{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
.attempt:first-of-type{border-top:0}
.score-badge{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;background:var(--petrol-t);color:var(--petrol);font:700 1.45rem var(--serif)}
.mini-bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.mini-bars small{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin-bottom:4px;gap:4px}
.pick{display:flex;align-items:center;gap:8px;font-size:.9rem}
.pick input{width:20px;height:20px}
/* ===== 4. SIMULADOR ===== */
.sim{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.sim-side{position:sticky;top:18px;display:grid;gap:16px}
.sim-main{display:grid;gap:18px;min-width:0}
.persona{display:flex;gap:12px;align-items:center}
.persona b{display:block;line-height:1.25}.persona small{color:var(--muted)}
.state{display:grid;gap:10px}
.state-row{display:grid;gap:4px;font-size:.9rem}.state-row .top{display:flex;justify-content:space-between;gap:8px}
.chat-head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.mood{display:grid;gap:4px;justify-items:end;font-size:.88rem;color:var(--muted)}.mood b{color:var(--navy)}
.chat-log{height:clamp(250px,40vh,440px);overflow-y:auto;padding:18px 4px 4px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:#F4F7FA}
.msg.other .bubble{border-bottom-left-radius:5px}
.msg.me .bubble{background:var(--navy);border-color:var(--navy);color:#fff;border-bottom-right-radius:5px}
.bubble .who{font-size:.78rem;font-weight:700;margin-bottom:3px;color:var(--petrol)}.msg.me .bubble .who{color:#A9D9CE}
.msg.new{animation:enter .3s ease both}
.typing{display:inline-flex;gap:5px;padding:4px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.decision fieldset{border:0;padding:0;margin:0;min-width:0}
.decision legend{padding:0;font:700 1.15rem var(--serif);margin-bottom:6px;display:block}
.decision legend small{display:block;color:var(--petrol);font:600 .88rem var(--sans);margin-bottom:2px}
.prompt{color:var(--muted);margin-bottom:16px;max-width:75ch}
.options{display:grid;gap:12px}
.option{position:relative;display:block;cursor:pointer}
.option input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.option-body{display:grid;grid-template-columns:24px 1fr;gap:14px;padding:16px 18px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;transition:border-color .15s,background .15s}
.option:hover .option-body{border-color:#9FB4C9;background:#FAFCFE}
.option input:focus-visible + .option-body{outline:3px solid var(--petrol);outline-offset:2px}
.option input:checked + .option-body{border-color:var(--petrol);background:var(--petrol-t);box-shadow:0 0 0 1px var(--petrol)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;margin-top:2px}
.dot svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.option input:checked + .option-body .dot{background:var(--petrol);border-color:var(--petrol)}.option input:checked + .option-body .dot svg{opacity:1}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;align-items:center}
.hint{border-left:4px solid var(--sage);background:var(--sage-t);padding:12px 16px;border-radius:0 var(--r-s) var(--r-s) 0;margin-bottom:16px;color:#21453B}
.fb{display:grid;gap:16px}.fb-head{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.fb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fb-block{border:1px solid var(--line);border-radius:var(--r-s);padding:14px 16px;background:#FBFCFD}
.fb-block h4{color:var(--petrol);margin-bottom:5px}
.fb-block.wide{grid-column:1/-1;background:var(--petrol-t);border-color:#BCD9E2}
.deltas{display:flex;flex-wrap:wrap;gap:8px}
/* ===== 5. RELATÓRIO ===== */
.hero-rep{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.score-ring{--p:0;--ring:var(--petrol);width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--ring) calc(var(--p)*1%),#E3E9F0 0);display:grid;place-items:center}
.score-ring div{width:118px;height:118px;background:#fff;border-radius:50%;display:grid;place-items:center;text-align:center}
.score-ring b{font:700 2.4rem var(--serif);line-height:1}.score-ring small{display:block;color:var(--muted);font-size:.78rem}
.quote{border-left:4px solid var(--line-2);padding:2px 0 2px 16px;color:var(--muted);font-style:italic;margin-top:10px}
.comp-split{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:26px;align-items:center}
.comp-row{display:grid;gap:7px;margin-bottom:18px}.comp-row .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.radar{width:100%;max-width:280px;height:auto;justify-self:center}
.step{display:grid;gap:10px;padding:20px 0;border-top:1px solid var(--line)}.step:first-of-type{border-top:0}
.step-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.quoteblock{background:#F3F6F9;border-radius:var(--r-s);padding:12px 14px;font-size:.95rem}
.quoteblock b{display:block;font-size:.82rem;color:var(--petrol);margin-bottom:2px}
.print-only{display:none}
.report-actions{display:flex;flex-wrap:wrap;gap:12px}
.cmp{width:100%;border-collapse:collapse;font-size:.95rem}
.cmp th,.cmp td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp thead th{background:#F1F5F8}
.cmp-wrap{overflow-x:auto}
/* ===== 6. RESPONSIVO ===== */
@media (max-width:900px){
  .grid-2,.sim,.cols-2,.comp-split{grid-template-columns:1fr}
  .sim-side{position:static}
  .mini-bars{grid-template-columns:repeat(2,minmax(0,1fr))}
  main{padding-top:22px}
}
@media (max-width:620px){
  .fb-grid{grid-template-columns:1fr}
  .hero-rep{grid-template-columns:1fr;justify-items:start}
  .attempt{grid-template-columns:auto 1fr}.attempt .row{grid-column:1/-1}
  .msg{max-width:96%}.card{padding:18px}.mood{justify-items:start}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* ===== 7. IMPRESSÃO ===== */
@media print{
  body{background:#fff;font-size:11pt}
  .topbar,.skip,.report-actions,.toast,#announcer,.no-print{display:none!important}
  main{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid;border-color:#bbb}
  .step,.comp-row{break-inside:avoid}
  .print-only{display:block!important}
  details.acc>*{display:block!important}
  .screen{animation:none}
}
</style>
</head>
<body>
<a class="skip" href="#main">Ir para o conteúdo principal</a>
<header class="topbar"><div class="topbar-in">
  <button class="brand" type="button" data-action="go" data-to="dashboard" aria-label="Leadership Coach, ir para o início">
    <span class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M4 16V8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3h-6l-4 3z"/></svg></span>
    <span><b>Leadership Coach</b><small>Conversas que desenvolvem líderes.</small></span>
  </button>
  <nav class="nav" aria-label="Navegação principal">
    <button type="button" data-action="go" data-to="dashboard" id="nav-dashboard">Início</button>
    <button type="button" data-action="go" data-to="library" id="nav-library">Biblioteca</button>
    <button type="button" data-action="go" data-to="history" id="nav-history">Histórico</button>
  </nav>
</div></header>
<main id="main">
  <noscript><div class="notice">O Leadership Coach precisa de JavaScript. Ative-o no navegador e recarregue a página.</div></noscript>
  <section class="screen" id="screen-dashboard" hidden></section>
  <section class="screen" id="screen-library" hidden></section>
  <section class="screen" id="screen-briefing" hidden></section>
  <section class="screen" id="screen-sim" hidden></section>
  <section class="screen" id="screen-report" hidden></section>
  <section class="screen" id="screen-history" hidden></section>
  <section class="screen" id="screen-compare" hidden></section>
</main>
<div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="dlg" aria-labelledby="dlg-title" aria-describedby="dlg-text">
  <form method="dialog"><h2 id="dlg-title"></h2><p id="dlg-text"></p>
    <div class="row"><button class="btn" value="cancel" id="dlg-cancel">Cancelar</button><button class="btn primary" value="ok" id="dlg-ok">Confirmar</button></div></form>
</dialog>
<script>
"use strict";
/* =====================================================================
   1. CONFIGURAÇÕES E CONSTANTES
   ===================================================================== */
const CFG = { key:"leadership_coach_v1", max:10, start:{trust:4,open:4,agree:0,prog:0}, total:5 };
const VARS = [
  {k:"trust",name:"Confiança"}, {k:"open",name:"Abertura ao diálogo"},
  {k:"agree",name:"Qualidade dos acordos"}, {k:"prog",name:"Evolução da conversa"}
];
const MOODS = {1:"Tensão alta",2:"Cautela",3:"Atenção",4:"Abertura",5:"Alinhamento"};

/* =====================================================================
   2. RUBRICAS DE COMPETÊNCIAS
   Ordem dos índices em cada alternativa: s:[escuta, empatia, comunicação, direcionamento]
   Níveis 0 a 3 por alternativa, com comportamento observável.
   ===================================================================== */
const COMPS = [
  {k:"esc",name:"Escuta ativa",icon:"ear",desc:"Demonstrar atenção, formular perguntas relevantes e verificar compreensão.",
   levels:["Não demonstrou escuta: não explorou a perspectiva do outro.","Escuta limitada: reconheceu a fala, mas não explorou nem verificou.","Escuta consistente: fez perguntas ou resumiu o que ouviu.","Escuta aprofundada: combinou perguntas abertas, paráfrase e verificação."],

function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(v===null||v===undefined||v===false) continue;
    if(k==="class") e.className=v;
    else if(k==="text") e.textContent=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(PROPS.includes(k)) e[k]=v;

  const add = k => { if(k===null||k===undefined||k===false) return; if(Array.isArray(k)) k.forEach(add); else e.append(k.nodeType?k:document.createTextNode(String(k))); };
  kids.forEach(add);
  return e;
}

/* =====================================================================
   5. MOTOR DE RAMIFICAÇÃO NARRATIVA
   O estado é sempre derivado da lista de decisões [{scene, option, hint}].
   ===================================================================== */
function matches(c,st){
  if(!c) return true;
  if(c.flag && !st.flags[c.flag]) return false;
  if(c.notFlag && st.flags[c.notFlag]) return false;
  if(c.flagAny && !c.flagAny.some(f=>st.flags[f])) return false;
  if(c.chose && !st.chosen.includes(c.chose)) return false;
  if(c.choseAny && !c.choseAny.some(o=>st.chosen.includes(o))) return false;
  for(const k of ["trust","open","agree","prog","score"]){
    const v = k==="score" ? st.score : st.vars[k];
    if(c[k+"Min"]!==undefined && !(v>=c[k+"Min"])) return false;
    if(c[k+"Max"]!==undefined && !(v<=c[k+"Max"])) return false;
  }
  return true;
}
const pickVariant = (scene,st) => scene.v.find(x=>matches(x.w,st)) || scene.v[scene.v.length-1];
const pickText = (x,scene) => typeof x==="string" ? x : (x[scene.id] || Object.values(x)[0]);

/* Efeito de cada alternativa nas variáveis narrativas, derivado das notas [esc, emp, com, dir] */
function narrativeDeltas(s){
  const [e,m,c,d]=s;
  return {
    trust: clamp(Math.round((e+m)/2)-1,-1,2),
    open:  clamp(e+m-2,-1,2),
    agree: clamp(d+(c>=2?1:0)-1,-1,2),
    prog:  clamp(Math.round((c+d)/2)-1,-1,2)
  };
}

function computeState(sc,decisions){
  const st={sceneId:sc.start,vars:{...CFG.start},scores:[0,0,0,0],flags:{},chosen:[],trail:[],hints:0,finished:false};
  decisions.forEach((d,i)=>{
    if(st.sceneId==="END") throw new Error("Decisões além do encerramento");
    const scene=sc.scenes[st.sceneId];
    if(!scene||d.scene!==st.sceneId) throw new Error("Cena inconsistente");
    sc.scenes[st.sceneId].id=st.sceneId;
    const idx=scene.o.findIndex(o=>o.id===d.option);
    if(idx<0) throw new Error("Alternativa inexistente");
    const opt=scene.o[idx], variant=pickVariant(scene,st), before={...st.vars}, dl=narrativeDeltas(opt.s);
    scene.id=st.sceneId;
    opt.s.forEach((v,k)=>{ st.scores[k]+=v; });
    VARS.forEach(v=>{ st.vars[v.k]=clamp(st.vars[v.k]+dl[v.k],0,CFG.max); });
    opt.fl.forEach(f=>{ st.flags[f]=true; });
    st.chosen.push(opt.id); if(d.hint) st.hints++;
    st.trail.push({n:i+1,scene,option:opt,idx,variant,before,after:{...st.vars},d:dl,hint:!!d.hint});
    st.sceneId=opt.next;
  });
  st.finished=st.sceneId==="END";
  return st;
}
const _memo={};
function maxFrom(sc,id,i){
  if(id==="END") return 0;
  const k=sc.id+":"+id+":"+i; if(k in _memo) return _memo[k];
  return _memo[k]=Math.max(...sc.scenes[id].o.map(o=>o.s[i]+maxFrom(sc,o.next,i)));
}
function computeResult(sc,decisions){
  const st=computeState(sc,decisions);
  if(!st.finished) throw new Error("Simulação incompleta");
  const pct=COMPS.map((c,i)=>clamp(Math.round(st.scores[i]/maxFrom(sc,sc.start,i)*100),0,100));
  const overall=clamp(Math.round(pct.reduce((a,b)=>a+b,0)/pct.length),0,100);
  st.score=overall;
  const key = sc.rules.critical.some(c=>matches(c,st)) ? "critical" : matches(sc.rules.constructive,st) ? "constructive" : "partial";
  return {st,pct,overall,key,ending:sc.endings[key],notes:sc.notes.filter(n=>matches(n.w,st)).map(n=>n.t)};
}

/* Verificação de integridade dos grafos (executada ao iniciar) */
function validateScenarios(){
  const errs=[];
  Object.values(SCENARIOS).forEach(sc=>{
    const seen=new Set();
    (function walk(id,stack){
      if(id==="END") return;
      const s=sc.scenes[id]; if(!s){ errs.push(sc.id+": cena inexistente "+id); return; }
      if(stack.includes(id)){ errs.push(sc.id+": ciclo em "+id); return; }
      seen.add(id);
      if(!s.o||s.o.length!==3) errs.push(sc.id+"/"+id+": precisa de 3 alternativas");
      if(!s.v||!s.v.length||s.v[s.v.length-1].w) errs.push(sc.id+"/"+id+": falta variante padrão");
      (s.o||[]).forEach(o=>{
        if(!(o.s&&o.s.length===4&&o.s.every(x=>x>=0&&x<=3))) errs.push(o.id+": notas inválidas");
        if(!(o.beh&&o.eff&&o.adj&&o.tip)) errs.push(o.id+": feedback incompleto");
        if(typeof o.eff==="object"&&!o.eff[id]) errs.push(o.id+": falta consequência para "+id);
        walk(o.next,stack.concat(id));
      });
    })(sc.start,[]);
    Object.keys(sc.scenes).forEach(id=>{ if(!seen.has(id)) errs.push(sc.id+": cena inalcançável "+id); });
    (function len(id,d){ if(id==="END"){ if(d<CFG.total) errs.push(sc.id+": rota com "+d+" decisões"); return; } sc.scenes[id]&&sc.scenes[id].o.forEach(o=>len(o.next,d+1)); })(sc.start,0);
  });
  return errs;
}

const app={store:null,screen:"dashboard",scenarioId:null,reportId:null,reportFresh:false,compare:[],selected:null,locked:false,typingTimer:null,storageWarned:false,notice:null};
const emptyStore=()=>({version:1,current:null,history:[]});
const str=(v,max=2000)=>typeof v==="string"?v.slice(0,max):"";
function sanitizeStore(raw){
  const out=emptyStore(); let dropped=0;
  if(!raw||typeof raw!=="object"||raw.version!==1) return {store:out,dropped:1};
  const okDec=arr=>Array.isArray(arr)&&arr.every(d=>d&&typeof d.scene==="string"&&typeof d.option==="string");
  const cleanDec=arr=>arr.map(d=>({scene:d.scene,option:d.option,hint:!!d.hint}));
  const c=raw.current;
  if(c){
    try{
      const sc=SCENARIOS[c.scenarioId]; if(!sc||!okDec(c.decisions)) throw new Error("formato");
      if(computeState(sc,c.decisions).finished) throw new Error("concluída");
      out.current={scenarioId:c.scenarioId,startedAt:str(c.startedAt,40)||new Date().toISOString(),decisions:cleanDec(c.decisions),hintScene:typeof c.hintScene==="string"?c.hintScene:null,awaitingContinue:!!c.awaitingContinue&&c.decisions.length>0};
    }catch(e){ dropped++; }
  }
  if(Array.isArray(raw.history)) raw.history.forEach(a=>{
    try{
      const sc=a&&SCENARIOS[a.scenarioId];
      if(!sc||typeof a.id!=="string"||isNaN(new Date(a.date))||!okDec(a.decisions)) throw new Error("formato");
      computeResult(sc,a.decisions);
      const rf=Array.isArray(a.reflection)?a.reflection:[], pl=a.plan&&typeof a.plan==="object"?a.plan:{};
      out.history.push({id:a.id,scenarioId:a.scenarioId,date:a.date,decisions:cleanDec(a.decisions),
        reflection:[0,1,2].map(i=>str(rf[i])),
        plan:{comp:COMPS.some(x=>x.k===pl.comp)?pl.comp:"",behavior:str(pl.behavior),situation:str(pl.situation),review:/^\d{4}-\d{2}-\d{2}$/.test(pl.review||"")?pl.review:""}});
    }catch(e){ dropped++; }
  });
  return {store:out,dropped};
}
function loadStore(){
  let raw=null;
  try{ raw=localStorage.getItem(CFG.key); }catch(e){ app.storageWarned=true; return emptyStore(); }
  if(!raw) return emptyStore();
  let p; try{ p=JSON.parse(raw); }catch(e){ app.notice="Os dados salvos estavam corrompidos e foram reiniciados."; return emptyStore(); }
  const {store,dropped}=sanitizeStore(p);
  if(dropped) app.notice="Alguns registros salvos eram inválidos ou de outra versão e foram ignorados.";
  return store;
}
function saveStore(){
  try{ localStorage.setItem(CFG.key,JSON.stringify(app.store)); }
  catch(e){ if(!app.storageWarned){ app.storageWarned=true; toast("Não foi possível salvar neste navegador. O progresso será mantido apenas enquanto esta página estiver aberta."); } }
}

async function restartSim(){
  const ok=await confirmDialog({title:"Reiniciar a simulação?",text:"O progresso desta conversa será descartado e ela recomeça do início.",confirmLabel:"Reiniciar",danger:true});
  if(!ok) return;
  const cur=app.store.current; app.store.current={scenarioId:cur.scenarioId,startedAt:new Date().toISOString(),decisions:[],hintScene:null,awaitingContinue:false};
  saveStore(); app.selected=null; startTyping(); announce("Simulação reiniciada.");
}
document.addEventListener("click",async e=>{
  const btn=e.target.closest("[data-action]"); if(!btn) return;
  const act=btn.dataset.action;
  switch(act){
    case "go": go(btn.dataset.to); break;
    case "brief": app.scenarioId=btn.dataset.id; go("briefing"); break;
    case "retry": app.scenarioId=btn.dataset.id; go("briefing"); break;
    case "begin":{
      if(app.store.current&&app.store.current.decisions.length){
        const ok=await confirmDialog({title:"Substituir a simulação em andamento?",text:"Existe uma conversa não concluída. Iniciar uma nova descarta esse progresso.",confirmLabel:"Iniciar nova",danger:true});
        if(!ok) break;
      }
      app.store.current={scenarioId:app.scenarioId,startedAt:new Date().toISOString(),decisions:[],hintScene:null,awaitingContinue:false};
      saveStore(); go("sim",{focus:false,sim:{typing:true}}); window.scrollTo(0,0); announce("Conversa iniciada."); break;}
    case "resume": go("sim",{sim:{focus:"decision"}}); break;
    case "hint": useHint(); break;
    case "continue": continueSim(); break;
    case "restart": restartSim(); break;
    case "view-report": app.reportId=btn.dataset.id; app.reportFresh=false; go("report"); break;
    case "save-reflect": saveReflection(); break;
    case "save-plan": savePlan(); break;
    case "print": window.print(); break;
    case "compare": go("compare"); break;
    case "delete-one":{
      const ok=await confirmDialog({title:"Excluir esta tentativa?",text:"O relatório, as reflexões e o plano desta tentativa serão removidos deste navegador.",confirmLabel:"Excluir",danger:true});
      if(ok){ app.store.history=app.store.history.filter(a=>a.id!==btn.dataset.id); saveStore(); viewHistory(); toast("Tentativa excluída."); announce("Tentativa excluída."); focusEl($("#screen-history h1")); }
      break;}
    case "delete-all":{
      const ok=await confirmDialog({title:"Excluir todo o histórico?",text:"Todas as tentativas, reflexões e planos serão removidos deste navegador. Uma simulação em andamento não é afetada.",confirmLabel:"Excluir tudo",danger:true});
      if(ok){ app.store.history=[]; app.compare=[]; saveStore(); viewHistory(); toast("Histórico excluído."); announce("Histórico excluído."); focusEl($("#screen-history h1")); }
      break;}
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.name==="opt"){ app.selected=t.value; const b=$("#btn-confirm"); if(b) b.disabled=false; }
  else if(t.name==="cmp"){
    const id=t.dataset.id;
    if(t.checked){ app.compare.push(id); if(app.compare.length>2){ const out=app.compare.shift(); const cb=$$("input[name=cmp]").find(x=>x.dataset.id===out); if(cb) cb.checked=false; } }
    else app.compare=app.compare.filter(x=>x!==id);
    updateCompareUI();
  }
  else if(t.dataset&&t.dataset.save==="reflection"){ saveReflection(); }
});
document.addEventListener("submit",e=>{ if(e.target.id==="choice-form"){ e.preventDefault(); confirmChoice(); } });

function init(){
  Object.values(SCENARIOS).forEach(sc=>Object.entries(sc.scenes).forEach(([k,s])=>{ s.id=k; }));
  const errs=validateScenarios();
  if(errs.length){ console.error("Leadership Coach: problemas nos cenários:",errs); toast("Foi detectado um problema na configuração dos cenários. Consulte o console."); }
  app.store=loadStore();
  go("dashboard",{focus:false});
  if(app.notice) announce(app.notice);
}
